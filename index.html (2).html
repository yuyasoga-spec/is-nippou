<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IS日報目標数値管理ツール ‐LIVプロジェクト推進室‐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f4eee1; --paper:#fffdf7; --ink:#2a2620; --muted:#8a8174; --faint:#b3aa99;
  --line:#e7ddc9; --line2:#d8ccb2;
  --accent:#c0843c; --accent-deep:#9a5e1f;
  --good:#3f7d5a; --good-bg:#e7f0ea; --warn:#b8772e; --warn-bg:#f6ecda; --bad:#b85c4a; --bad-bg:#f6e6e1;
  --m0:#c0843c; --m1:#9a5e1f; --m2:#3f7d5a; --m3:#b85c4a;
}
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--ink); font-family:'Zen Kaku Gothic New',sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased}
.wrap{max-width:1080px; margin:0 auto; padding:28px 22px 80px}
h1{font-family:'Shippori Mincho B1',serif; font-weight:700; font-size:25px; letter-spacing:.04em}
.kicker{font-size:11px; letter-spacing:.14em; color:var(--accent-deep); margin-bottom:4px}
.topline{border-top:2px solid var(--ink); margin:14px 0 18px}
.tabs{display:flex; gap:8px; margin-bottom:18px}
.tab{font-family:'Shippori Mincho B1',serif; font-size:15px; padding:8px 18px; border:1px solid var(--line2); border-radius:999px; background:transparent; color:var(--muted); cursor:pointer}
.tab.on{background:var(--ink); color:#fdf8ee; border-color:var(--ink)}
.bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
.monthnav{display:inline-flex; align-items:center; gap:14px; border:1px solid var(--line2); border-radius:10px; padding:7px 14px; background:var(--paper)}
.monthnav b{font-family:'Shippori Mincho B1',serif; font-size:15px; min-width:96px; text-align:center}
.navbtn{cursor:pointer; color:var(--muted); font-size:18px; line-height:1; user-select:none; padding:0 2px}
.navbtn:hover{color:var(--accent-deep)}
.search{position:relative; flex:1; min-width:200px}
.search input{width:100%; padding:9px 12px 9px 32px; border:1px solid var(--line2); border-radius:10px; background:var(--paper); font-family:inherit; font-size:14px; color:var(--ink)}
.search::before{content:'⌕'; position:absolute; left:11px; top:50%; transform:translateY(-52%); color:var(--faint); font-size:17px}
.chips{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:20px}
.chip{font-size:12.5px; padding:5px 13px; border-radius:999px; border:1px solid var(--line2); background:var(--paper); color:var(--muted); cursor:pointer; white-space:nowrap}
.chip:hover{border-color:var(--accent); color:var(--accent-deep)}
.chip.on{background:var(--accent); border-color:var(--accent); color:#fff}
.chip.toggle.on{background:var(--good); border-color:var(--good)}
.card{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:16px}
.card.dim{opacity:.55}
.divhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px}
.acc{cursor:pointer; user-select:none}
.divhead.acc:hover .nm, .pjhead.acc:hover .nm{text-decoration:underline; text-underline-offset:3px}
.divhead .nm{font-family:'Shippori Mincho B1',serif; font-size:18px; font-weight:600}
.sub{font-size:12px; color:var(--faint)}
.mgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px}
.mcell{background:var(--bg); border-radius:10px; padding:11px 13px}
.mcell .lab{font-size:12px; color:var(--muted)}
.mcell .val{display:flex; align-items:baseline; gap:5px; margin:3px 0 8px}
.mcell .val .a{font-family:'Shippori Mincho B1',serif; font-size:21px; font-weight:600}
.mcell .val .t{font-size:12px; color:var(--faint)}
.mcell .val .p{margin-left:auto; font-size:12.5px; color:var(--muted)}
.bar2{height:6px; border-radius:999px; background:var(--line); overflow:hidden}
.bar2 i{display:block; height:100%; border-radius:999px; background:var(--accent)}
.pjhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:6px 0 4px}
.pjhead .nm{font-size:15px; font-weight:700}
.badge{font-size:11px; padding:2px 9px; border-radius:7px}
.badge.run{background:var(--good-bg); color:var(--good)}
.badge.stop{background:#efe9dd; color:var(--muted)}
.tag{font-size:11.5px; color:var(--faint)}
table.t{width:100%; border-collapse:collapse; table-layout:fixed; margin-top:6px}
table.t th{font-size:11px; color:var(--faint); font-weight:400; text-align:left; padding:5px 7px}
table.t td{padding:8px 7px; border-top:1px solid var(--line); font-size:12.5px; vertical-align:middle}
.num{font-variant-numeric:tabular-nums}
.pace{font-size:11px; padding:2px 9px; border-radius:7px; white-space:nowrap}
.pace.good{background:var(--good-bg); color:var(--good)}
.pace.warn{background:var(--warn-bg); color:var(--warn)}
.pace.bad{background:var(--bad-bg); color:var(--bad)}
.pace.na{color:var(--faint)}
.progwrap{display:flex; align-items:center; gap:9px}
.progwrap .pct{font-size:11.5px; color:var(--muted); min-width:34px; text-align:right}
.empty{color:var(--faint); font-size:13px; padding:18px 4px; text-align:center}
.btn{font-family:inherit; font-size:13px; padding:7px 14px; border:1px solid var(--line2); border-radius:9px; background:var(--paper); color:var(--ink); cursor:pointer}
.btn:hover{border-color:var(--accent); color:var(--accent-deep)}
.btn.dark{background:var(--ink); color:#fdf8ee; border-color:var(--ink)}
.btn.sm{font-size:12px; padding:5px 10px}
.btn.ghost{border-color:transparent; color:var(--faint)}
.btn.ghost:hover{color:var(--bad); border-color:transparent}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
input.inp,select.inp,textarea.inp{font-family:inherit; font-size:13px; color:var(--ink); background:var(--paper); border:1px solid var(--line2); border-radius:8px; padding:6px 8px}
input.num-in{width:62px; text-align:right}
.tgt{display:flex; flex-direction:column; gap:3px}
.tgt label{font-size:11px; color:var(--muted)}
.tgtgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin:6px 0 4px}
.daytable{width:100%; border-collapse:collapse; margin-top:8px}
.daytable th{font-size:11px; color:var(--faint); font-weight:400; padding:5px 6px; text-align:center; border-bottom:1px solid var(--line)}
.daytable td{padding:5px 6px; border-bottom:1px solid var(--line); text-align:center}
.note{margin-top:6px; display:grid; gap:8px}
.note textarea{width:100%; min-height:60px; resize:vertical}
.note .lab{font-size:11px; color:var(--muted); margin-bottom:2px}
.divbox{border:1px solid var(--line); border-radius:14px; margin-bottom:14px; background:var(--paper); overflow:hidden}
.divbar{display:flex; align-items:center; gap:10px; padding:14px 18px; cursor:pointer; flex-wrap:wrap}
.divbar .nm{font-family:'Shippori Mincho B1',serif; font-size:17px; font-weight:600}
.caret{color:var(--muted); transition:transform .15s; font-size:13px}
.caret.open{transform:rotate(90deg)}
.divbody{padding:0 18px 16px}
.pjbox{border:1px solid var(--line); border-radius:11px; margin:10px 0; padding:12px 14px; background:var(--bg)}
.foot{margin-top:24px; font-size:12px; color:var(--faint); text-align:center; line-height:1.9}
.foot a{color:var(--accent-deep)}
#gate{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:50; padding:24px}
.gatecard{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:36px 40px; max-width:420px; text-align:center}
.gatecard h1{margin:6px 0 14px}
.gatecard p{color:var(--muted); font-size:14px; margin-bottom:20px}
.userbar{display:flex; align-items:center; gap:10px; justify-content:flex-end; font-size:12.5px; color:var(--muted); margin-bottom:6px}
.rev{margin-bottom:16px}
.revsec{margin-top:10px}
.revsec .h{font-size:12px; color:var(--accent-deep); font-weight:700; margin-bottom:3px}
.revsec ul{margin:0; padding-left:18px}
.revsec li{font-size:13px; margin:2px 0}
.revsum{display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin:4px 0 8px}
.revsum b{color:var(--ink); font-variant-numeric:tabular-nums}
.csvbar{margin:2px 0 18px}
.csvpanel{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px}
.csvpanel label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.csvpanel select{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.csvhint{font-size:11.5px;color:var(--faint);margin-top:8px;line-height:1.7}
.imaster{margin-bottom:14px}
.imbody{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;max-width:440px}
.imrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.imrow .inp{flex:1}
.ismall{font-size:12px;padding:5px 6px;min-width:96px}
.dtwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="gate">
  <div class="gatecard">
    <div class="kicker">LIVプロジェクト推進室</div>
    <h1>IS日報目標数値管理ツール</h1>
    <p>社内アカウント（@liv-inc.jp）でログインしてください。</p>
    <button class="btn dark" id="signin">Googleでログイン</button>
    <div id="gateerr" style="color:var(--bad);margin-top:12px;font-size:13px"></div>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <div class="userbar"><span id="useremail"></span><button class="btn ghost sm" id="signout">ログアウト</button></div>
  <div class="kicker">LIVプロジェクト推進室</div>
  <h1>IS日報目標数値管理ツール</h1>
  <div class="topline"></div>

  <div class="tabs">
    <button class="tab" id="tab-dash">目標ダッシュボード</button>
    <button class="tab" id="tab-input">日次入力</button>
    <button class="tab" id="tab-review">週次総評</button>
  </div>

  <div id="toolbar"></div>
  <div id="root"></div>

  <div class="foot">
    データはチームで共有されています（Firestore）。<br>
    <span id="resetwrap"></span>
  </div>
</div>

<script>
// ====== 設定：ここを自分の値に置き換えてください ======
var firebaseConfig = {
  apiKey: "AIzaSyAK0MFFwWdb8gHYPmBjH4Moq0Zygww_pXo",
  authDomain: "is-nippou-tool.firebaseapp.com",
  projectId: "is-nippou-tool",
  storageBucket: "is-nippou-tool.firebasestorage.app",
  messagingSenderId: "1050189955298",
  appId: "1:1050189955298:web:db3f5bc983d0aa1bcfdebb"
};
var WORKER_URL = "https://isnippou.yuya-soga.workers.dev";
var ALLOWED_DOMAIN = "liv-inc.jp";
// =====================================================
firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();
var docRef = db.collection('encareer').doc('state');

// ===== 定数 =====
var METRICS = ['ADアポ数','AD参加数','面談アポ数','面談参加数'];
var SHORT = ['ADアポ','AD参加','面談アポ','面談参加'];
var ALLM = [
  {label:'ADアポ数', short:'ADアポ'},
  {label:'AD参加数', short:'AD参加'},
  {label:'面談アポ数', short:'面談アポ'},
  {label:'面談参加数', short:'面談参加'},
  {label:'面談参加予定者数', short:'面談参加予定'},
  {label:'前日応募者数', short:'前日応募'}
];
var NM = ALLM.length;
var BIZ = { ad:{label:'AD事業',metrics:[0,1,2,3,5],targets:[0,1,2,3,5]}, school:{label:'スクール事業',metrics:[2,3,4,5],targets:[2,3]} };
function bizOf(div){ return BIZ[(div&&div.bizType)||'ad'] || BIZ.ad; }
function metricsOf(div){ return bizOf(div).metrics; }
function targetsOf(div){ return bizOf(div).targets; }
function hasTarget(div, mi){ return targetsOf(div).indexOf(mi)>=0; }
function zeros(){ var a=[]; for(var i=0;i<NM;i++){ a.push(0); } return a; }
function padArr(a){ a=(a||[]).slice(); while(a.length<NM){ a.push(0); } return a; }
var MCOL = ['var(--m0)','var(--m1)','var(--m2)','var(--m3)'];
var COLORS = ['#c0843c','#3f7d5a','#4f7cb3','#9a5e1f','#b85c4a','#7a6aa8','#3f8f8f','#a85c8a','#6f8f3a','#c2604a'];
function pickColor(n){ return COLORS[((n%COLORS.length)+COLORS.length)%COLORS.length]; }
function swatch(color, size){ var s=size||11; return '<span style="display:inline-block;width:'+s+'px;height:'+s+'px;border-radius:3px;background:'+color+';flex:none"></span>'; }
var STORE_KEY = 'encareer_target_tool_v1';

// ===== ユーティリティ =====
function $(id){ return document.getElementById(id); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pad2(n){ return String(n).padStart(2,'0'); }
function parseD(s){ return s ? new Date(s+'T00:00:00') : null; }
function todayISO(){
  var d = new Date();
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function curYM(){
  var d = new Date();
  return d.getFullYear()+'-'+pad2(d.getMonth()+1);
}
function ymOf(dateStr){ return (dateStr||'').slice(0,7); }
function daysInMonth(ym){
  var p = ym.split('-');
  return new Date(Number(p[0]), Number(p[1]), 0).getDate();
}
function monthLabel(ym){
  var p = ym.split('-');
  return Number(p[0])+'年'+Number(p[1])+'月';
}
function shiftYM(ym, delta){
  var p = ym.split('-');
  var d = new Date(Number(p[0]), Number(p[1])-1+delta, 1);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1);
}
function fmtMD(s){
  var d = parseD(s);
  if(!d) return '—';
  var wd = ['日','月','火','水','木','金','土'][d.getDay()];
  return (d.getMonth()+1)+'/'+d.getDate()+'('+wd+')';
}
function weekRangeNow(){
  var d = new Date();
  var day = d.getDay();
  var diff = (day===0 ? -6 : 1-day);
  var mon = new Date(d);
  mon.setDate(d.getDate()+diff);
  mon.setHours(0,0,0,0);
  var sun = new Date(mon);
  sun.setDate(mon.getDate()+6);
  sun.setHours(23,59,59,999);
  return [mon, sun];
}
function elapsedDays(ym){
  var p = ym.split('-');
  var y = Number(p[0]), m = Number(p[1]);
  var di = daysInMonth(ym);
  var t = new Date();
  var ty = t.getFullYear(), tm = t.getMonth()+1, td = t.getDate();
  if(y < ty || (y===ty && m < tm)) return di;
  if(y > ty || (y===ty && m > tm)) return 0;
  return Math.min(td, di);
}

// ===== 集計 =====
function pjTarget(pj, ym){
  var t = pj.monthlyTargets[ym];
  return t ? padArr(t) : zeros();
}
function pjMonthActual(pj, ym){
  var sum = zeros();
  pj.days.forEach(function(d){
    if(ymOf(d.date) === ym){
      var act = padArr(d.actual);
      for(var i=0;i<NM;i++){ sum[i] += Number(act[i])||0; }
    }
  });
  return sum;
}
function pjWeekActual(pj){
  var wr = weekRangeNow();
  var sum = zeros();
  pj.days.forEach(function(d){
    var dt = parseD(d.date);
    if(dt && dt >= wr[0] && dt <= wr[1]){
      var act = padArr(d.actual);
      for(var i=0;i<NM;i++){ sum[i] += Number(act[i])||0; }
    }
  });
  return sum;
}
function weekTarget(monthTargetI, ym){
  return monthTargetI * 7 / daysInMonth(ym);
}
function dailyTarget(monthTargetI, ym){
  return monthTargetI / daysInMonth(ym);
}
function fmt1(x){ return Math.round(x*10)/10; }
function paceOf(actualI, targetI, ym){
  if(targetI <= 0) return {label:'—', cls:'na'};
  var di = daysInMonth(ym);
  var el = elapsedDays(ym);
  var expected = targetI * (el/di);
  if(expected <= 0) return {label:'開始前', cls:'na'};
  var r = actualI/expected;
  if(r >= 1) return {label:'順調', cls:'good'};
  if(r >= 0.85) return {label:'やや遅れ', cls:'warn'};
  return {label:'遅れ', cls:'bad'};
}
function activeProjects(div){
  return div.projects.filter(function(p){ return p.status === '運用中'; });
}
function divRollup(div, ym){
  var mt=zeros(), ma=zeros(), wa=zeros();
  activeProjects(div).forEach(function(p){
    var t = padArr(pjTarget(p, ym));
    var a = pjMonthActual(p, ym);
    var w = pjWeekActual(p);
    for(var i=0;i<NM;i++){ mt[i]+=t[i]; ma[i]+=a[i]; wa[i]+=w[i]; }
  });
  return {target:mt, actual:ma, week:wa};
}
function pct(a, t){ return t>0 ? Math.round(a/t*100) : 0; }
function barColor(p){ return p>=85 ? 'var(--good)' : (p>=60 ? 'var(--accent)' : 'var(--warn)'); }

// ===== 状態 =====
var state = { divisions: [], reviews: {}, inputters: [], ui: { view:'dashboard', month: curYM(), search:'', filterId:null, activeOnly:false } };

function seed(){
  var ym = curYM();
  function day(date, a){ return {id:uid(), date:date, actual:a, jisshi:'', na:'', noteOpen:false, by:''}; }
  var p = ym.split('-'); var yy=p[0], mm=p[1];
  function d(n){ return yy+'-'+mm+'-'+pad2(n); }
  return {
    inputters: ['沼田','関','原','村井'].map(function(n){ return {id:uid(), name:n}; }),
    divisions: [
      {
        id: uid(), name: 'IS事業部', color: '#4f7cb3', open: true, bizType:'ad',
        projects: [
          { id: uid(), name: 'Star Creation Next', color: '#c0843c', status: '運用中', open: true,
            monthlyTargets: makeT(ym, [80,64,48,32,0,1650]),
            days: [ day(d(1),[3,2,2,1,0,80]), day(d(2),[3,3,1,1,0,72]), day(d(3),[2,2,2,2,0,90]),
                    day(d(4),[3,2,1,1,0,61]), day(d(5),[2,2,2,1,0,55]), day(d(8),[3,2,1,1,0,77]),
                    day(d(9),[2,2,1,1,0,63]), day(d(10),[3,2,2,1,0,88]), day(d(11),[2,1,1,1,0,89]) ] },
          { id: uid(), name: 'TGCキャリア', color: '#3f7d5a', status: '運用中', open: true,
            monthlyTargets: makeT(ym, [60,48,36,24,0,1200]),
            days: [ day(d(2),[3,2,1,1,0,40]), day(d(3),[2,2,2,1,0,52]), day(d(4),[3,3,2,2,0,45]),
                    day(d(5),[2,2,1,1,0,33]), day(d(9),[3,2,2,1,0,61]), day(d(10),[2,2,1,1,0,48]),
                    day(d(11),[3,2,1,1,0,44]) ] },
          { id: uid(), name: '旧媒体PJ', color: '#9a8f7d', status: '停止中', open: false,
            monthlyTargets: makeT(ym, [20,12,8,4,0,0]), days: [] }
        ]
      },
      {
        id: uid(), name: 'スクール事業部', color: '#7a5ea8', open: true, bizType:'school',
        projects: [
          { id: uid(), name: 'CLOUD NINE SCHOOL', color: '#b5793f', status: '運用中', open: true,
            monthlyTargets: makeT(ym, [0,0,88,5,0,0]),
            days: [ day(d(9),[0,0,2,1,7,12]), day(d(10),[0,0,1,0,9,8]), day(d(11),[0,0,1,0,9,10]) ] }
        ]
      }
    ],
    ui: { view:'dashboard', month: ym, search:'', filterId:null, activeOnly:false }
  };
}
function makeT(ym, arr){ var o={}; o[ym]=arr.slice(); return o; }

function migrate(){
  if(!state.inputters){ state.inputters = []; }
  state.divisions.forEach(function(d, di){
    if(!d.color){ d.color = pickColor(di); }
    if(!d.bizType){ d.bizType = 'ad'; }
    d.projects.forEach(function(p, pi){
      if(!p.color){ p.color = pickColor(di*3+pi+1); }
      if(!p.monthlyTargets){ p.monthlyTargets = {}; }
      Object.keys(p.monthlyTargets).forEach(function(k){ p.monthlyTargets[k] = padArr(p.monthlyTargets[k]); });
      if(!p.days){ p.days = []; }
      p.days.forEach(function(dy){ dy.actual = padArr(dy.actual); if(dy.by===undefined){ dy.by=''; } });
    });
  });
}
function migrateColors(){ migrate(); }
var _lastSync = '';
function applySnap(snap){
  if(!snap.exists){ initEmpty(); return; }
  var data = snap.data() || {};
  var divisions = data.divisions || [];
  var reviews = data.reviews || {};
  var inputters = data.inputters || [];
  var js = JSON.stringify({d:divisions, r:reviews, i:inputters});
  if(js === _lastSync) return;
  _lastSync = js;
  state.divisions = divisions;
  state.reviews = reviews;
  state.inputters = inputters;
  migrate();
  render();
}
function initEmpty(){
  state.divisions = [];
  state.reviews = {};
  state.inputters = [];
  _lastSync = JSON.stringify({d:[], r:{}, i:[]});
  docRef.set({ divisions: [], reviews: {}, inputters: [] }).catch(function(e){ console.error(e); });
  render();
}
var _subbed = false;
function subscribe(){
  if(_subbed) return;
  _subbed = true;
  docRef.onSnapshot(function(snap){ applySnap(snap); }, function(err){ console.error('snapshot', err); });
}
var _saveT = null;
function save(){
  if(!docRef) return;
  clearTimeout(_saveT);
  _saveT = setTimeout(function(){
    var payload = { divisions: state.divisions, reviews: state.reviews, inputters: state.inputters };
    _lastSync = JSON.stringify({d:payload.divisions, r:payload.reviews, i:payload.inputters});
    docRef.set(payload).catch(function(e){ console.error('save', e); });
  }, 400);
}

// ===== 検索ヘルパ =====
function findDiv(id){ return state.divisions.find(function(d){ return d.id===id; }); }
function findPJ(id){
  for(var i=0;i<state.divisions.length;i++){
    var p = state.divisions[i].projects.find(function(x){ return x.id===id; });
    if(p) return p;
  }
  return null;
}
function divOfPJ(pid){
  for(var i=0;i<state.divisions.length;i++){
    if(state.divisions[i].projects.some(function(x){ return x.id===pid; })) return state.divisions[i];
  }
  return null;
}

// ===== ダッシュボード描画 =====
function matchSearch(div){
  var s = (state.ui.search||'').trim().toLowerCase();
  if(!s) return {div:true, pjs:null};
  var dn = div.name.toLowerCase().indexOf(s) >= 0;
  var pjs = div.projects.filter(function(p){ return p.name.toLowerCase().indexOf(s) >= 0; });
  if(dn) return {div:true, pjs:null};
  if(pjs.length) return {div:true, pjs:pjs.map(function(p){return p.id;})};
  return {div:false, pjs:[]};
}
function visibleProjects(div){
  var out = div.projects.slice();
  if(state.ui.activeOnly){ out = out.filter(function(p){ return p.status==='運用中'; }); }
  var fid = state.ui.filterId;
  if(fid){
    if(findDiv(fid)){ if(div.id!==fid) return []; }
    else if(findPJ(fid)){ out = out.filter(function(p){ return p.id===fid; }); }
  }
  var ms = matchSearch(div);
  if(!ms.div) return [];
  if(ms.pjs){ out = out.filter(function(p){ return ms.pjs.indexOf(p.id)>=0; }); }
  return out;
}

// ===== 週次総評 =====
function isoOf(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function recentWeeks(n){
  var mon = weekRangeNow()[0];
  var out = [];
  for(var i=0;i<n;i++){ var m=new Date(mon); m.setDate(mon.getDate()-7*i); out.push(isoOf(m)); }
  return out;
}
function weekLabelOf(mondayIso){
  var mon = parseD(mondayIso); var sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return (mon.getMonth()+1)+'/'+mon.getDate()+'〜'+(sun.getMonth()+1)+'/'+sun.getDate();
}
function weekRangeOf(weekIso){
  var mon = parseD(weekIso); mon.setHours(0,0,0,0);
  var sun = new Date(mon); sun.setDate(mon.getDate()+6); sun.setHours(23,59,59,999);
  return [mon, sun];
}
function weekActualRange(pj, mon, sun){
  var sum=zeros();
  pj.days.forEach(function(d){ var dt=parseD(d.date); if(dt&&dt>=mon&&dt<=sun){ var act=padArr(d.actual); for(var i=0;i<NM;i++){ sum[i]+=Number(act[i])||0; } } });
  return sum;
}
function weekTextsRange(pj, mon, sun){
  var js=[], na=[];
  pj.days.forEach(function(d){ var dt=parseD(d.date); if(dt&&dt>=mon&&dt<=sun){ if(d.jisshi&&d.jisshi.trim()){js.push(d.jisshi.trim());} if(d.na&&d.na.trim()){na.push(d.na.trim());} } });
  return { jisshi: js, na: na };
}
function pjWeekTargets(pj, ymRef){
  var mt = padArr(pjTarget(pj, ymRef)); var wt=[];
  for(var i=0;i<NM;i++){ wt.push(Math.round(weekTarget(mt[i], ymRef))); }
  return wt;
}
function reviewKey(weekIso, type, id){ return weekIso+'__'+type+'__'+id; }

function buildScopeContext(weekIso, type, id){
  var r = weekRangeOf(weekIso); var mon=r[0], sun=r[1];
  var ymRef = ymOf(weekIso);
  if(type==='pj'){
    var pj = findPJ(id); var div = divOfPJ(id);
    var ms = targetsOf(div);
    var a = weekActualRange(pj, mon, sun);
    var wt = pjWeekTargets(pj, ymRef);
    var txt = weekTextsRange(pj, mon, sun);
    return { scope:'PJ単体', week: weekLabelOf(weekIso), division: div?div.name:'', name: pj.name, metrics: ms.map(function(i){return ALLM[i].label;}), weekTarget: ms.map(function(i){return wt[i];}), weekActual: ms.map(function(i){return a[i];}), jisshi: txt.jisshi, na: txt.na };
  } else {
    var dv = findDiv(id);
    var ms2 = targetsOf(dv);
    var totT=zeros(), totA=zeros(); var projects=[];
    activeProjects(dv).forEach(function(pj){
      var a = weekActualRange(pj, mon, sun); var wt = pjWeekTargets(pj, ymRef); var txt = weekTextsRange(pj, mon, sun);
      for(var i=0;i<NM;i++){ totT[i]+=wt[i]; totA[i]+=a[i]; }
      projects.push({ name: pj.name, weekTarget: ms2.map(function(i){return wt[i];}), weekActual: ms2.map(function(i){return a[i];}), jisshi: txt.jisshi, na: txt.na });
    });
    return { scope:'事業部全体', week: weekLabelOf(weekIso), name: dv.name, metrics: ms2.map(function(i){return ALLM[i].label;}), totalTarget: ms2.map(function(i){return totT[i];}), totalActual: ms2.map(function(i){return totA[i];}), projects: projects };
  }
}
var _gen = {};
function callWorker(ctx){
  return auth.currentUser.getIdToken().then(function(token){
    return fetch(WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}, body: JSON.stringify({context: ctx}) });
  }).then(function(res){
    if(!res.ok){ return res.text().then(function(t){ throw new Error(res.status+' '+t); }); }
    return res.json();
  });
}
function generateReview(weekIso, type, id){
  var key = reviewKey(weekIso, type, id);
  _gen[key] = true; renderReview();
  var ctx = buildScopeContext(weekIso, type, id);
  callWorker(ctx).then(function(r){
    state.reviews[key] = { did:r.did||[], achieved:r.achieved||[], concerns:r.concerns||[], by:(auth.currentUser&&auth.currentUser.email)||'', at:Date.now() };
    _gen[key]=false; save(); renderReview();
  }).catch(function(e){
    _gen[key]=false; renderReview();
    alert('総評の生成に失敗しました。\n'+e.message+'\n（Worker URL・APIキー・ログインを確認してください）');
  });
}
function sumLine(target, actual, mlist){
  var html='<div class="revsum">';
  (mlist||[0,1,2,3]).forEach(function(i){ var p=pct(actual[i]||0,target[i]||0); html+='<span>'+ALLM[i].short+' <b>'+(actual[i]||0)+'</b> / '+(target[i]||0)+'（'+p+'%）</span>'; });
  return html+'</div>';
}
function reviewBlock(weekIso, type, id){
  var key = reviewKey(weekIso, type, id);
  var rev = state.reviews[key];
  var loading = !!_gen[key];
  var html = '';
  if(rev){
    html += '<div class="revsec"><div class="h">実施したこと</div><ul>'+(rev.did||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
    html += '<div class="revsec"><div class="h">成果・できたこと</div><ul>'+(rev.achieved||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
    html += '<div class="revsec"><div class="h">懸念点</div><ul>'+(rev.concerns||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
  }
  html += '<div style="margin-top:8px">';
  if(loading){ html += '<button class="btn sm" disabled>生成中…</button>'; }

function renderReview(){
  var weeks = recentWeeks(8);
  if(!state.ui.reviewWeek || weeks.indexOf(state.ui.reviewWeek)<0){ state.ui.reviewWeek = weeks[0]; }
  var wk = state.ui.reviewWeek;
  var r = weekRangeOf(wk); var mon=r[0], sun=r[1]; var ymRef = ymOf(wk);
  var html = '';
  html += '<div class="chips" style="margin-bottom:18px">';
  weeks.forEach(function(w){
    html += '<span class="chip'+(w===wk?' on':'')+'" onclick="setReviewWeek(\''+w+'\')">'+weekLabelOf(w)+(w===weeks[0]?'（今週）':'')+'</span>';
  });
  html += '</div>';
  var any=false;
  state.divisions.forEach(function(div){
    var aps = activeProjects(div);
    if(aps.length===0){ return; }
    any=true;
    var totT=zeros(), totA=zeros();
    aps.forEach(function(pj){ var a=weekActualRange(pj,mon,sun); var wt=pjWeekTargets(pj,ymRef); for(var i=0;i<NM;i++){ totT[i]+=wt[i]; totA[i]+=a[i]; } });

    html += reviewBlock(wk, 'div', div.id);
    aps.forEach(function(pj){

      html += '<div class="pjbox" style="box-shadow:inset 3px 0 0 0 '+pj.color+'; margin-top:14px">';
      html += '<div class="pjhead">'+swatch(pj.color)+'<span class="nm">'+esc(pj.name)+'</span><span class="sub">PJの総評</span></div>';
      html += sumLine(wt, a, targetsOf(div));

  });
  if(!any){ html += '<div class="empty">運用中のPJがありません。日次入力でデータを追加してください。</div>'; }

}

function opt(v,l,cur){ return '<option value="'+v+'"'+(v===cur?' selected':'')+'>'+esc(l)+'</option>'; }
function csvCfg(){ if(!state.ui.csv){ state.ui.csv={unit:'pj',period:'all',agg:'daily'}; } return state.ui.csv; }
function toggleCsv(){ state.ui.csvOpen=!state.ui.csvOpen; renderToolbar(); }
function setCsv(k,v){ csvCfg()[k]=v; }
function csvBarHtml(){
  var c=csvCfg();
  var h='<div class="csvbar"><button class="btn ghost sm" onclick="toggleCsv()">⬇ CSV出力</button>';
  if(state.ui.csvOpen){
    h+='<div class="csvpanel">';
    h+='<label>単位<select onchange="setCsv(\'unit\',this.value)">'+opt('pj','PJごと',c.unit)+opt('div','事業部ごと（運用中PJ合計）',c.unit)+'</select></label>';
    h+='<label>期間<select onchange="setCsv(\'period\',this.value)">'+opt('week','今週',c.period)+opt('month',monthLabel(state.ui.month),c.period)+opt('all','全期間',c.period)+'</select></label>';
    h+='<label>集計<select onchange="setCsv(\'agg\',this.value)">'+opt('daily','日次明細',c.agg)+opt('weekly','週次集計',c.agg)+opt('monthly','月次集計',c.agg)+'</select></label>';
    h+='<button class="btn dark sm" onclick="downloadCsv()">ダウンロード</button>';
    h+='</div>';
    h+='<div class="csvhint">※ すべての事業部・PJを対象に出力します（停止中PJは「PJごと」では含めて出力、「事業部ごと」では合計から除外）。Excelでそのまま開けます。</div>';
  }
  return h+'</div>';
}
function mondayIsoOf(dateStr){ var d=parseD(dateStr); var day=d.getDay(); var diff=(day===0?-6:1-day); var m=new Date(d); m.setDate(d.getDate()+diff); return m.getFullYear()+'-'+pad2(m.getMonth()+1)+'-'+pad2(m.getDate()); }
function addDaysIso(iso,n){ var d=parseD(iso); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function csvCell(x){ var s=(x==null?'':String(x)); if(/[",\n]/.test(s)){ s='"'+s.replace(/"/g,'""')+'"'; } return s; }
function bizMetrics(bt){ return (BIZ[bt]||BIZ.ad).metrics; }
function bizTargets(bt){ return (BIZ[bt]||BIZ.ad).targets; }
function buildCsv(unit, period, agg){
  var from=null, to=null, plabel='全期間';
  if(period==='week'){ var wr=weekRangeNow(); from=wr[0]; to=wr[1]; plabel='今週'; }
  else if(period==='month'){ var ym=state.ui.month; from=parseD(ym+'-01'); var di=daysInMonth(ym); to=parseD(ym+'-'+pad2(di)); to.setHours(23,59,59,999); plabel=monthLabel(ym); }
  var recs=[];
  state.divisions.forEach(function(div){
    var bt = div.bizType||'ad';
    div.projects.forEach(function(pj){
      pj.days.forEach(function(d){
        if(!d.date) return; var dt=parseD(d.date); if(!dt) return;
        if(from && dt<from) return; if(to && dt>to) return;
        var ymv=ymOf(d.date); var tg=padArr(pjTarget(pj, ymv)); var act=padArr(d.actual);
        var dtar=[]; for(var i=0;i<NM;i++){ dtar.push(dailyTarget(tg[i], ymv)); }
        recs.push({divId:div.id, divName:div.name, bizType:bt, pjId:pj.id, pjName:pj.name, status:pj.status, date:d.date, actual:act, dtar:dtar, jisshi:(d.jisshi||''), na:(d.na||''), by:inputterName(d.by)});
      });
    });
  });
  var map={}, order=[];
  recs.forEach(function(r){
    if(unit==='div' && r.status!=='運用中') return;
    var bkey, meta;
    if(agg==='daily'){ bkey=r.date; meta={date:r.date}; }
    else if(agg==='weekly'){ var mk=mondayIsoOf(r.date); bkey=mk; meta={start:mk, end:addDaysIso(mk,6)}; }
    else { bkey=ymOf(r.date); meta={ym:bkey}; }
    var gkey = unit==='pj' ? (r.divId+'|'+r.pjId+'|'+bkey) : (r.divId+'|'+bkey);
    if(!map[gkey]){ map[gkey]={divName:r.divName, bizType:r.bizType, pjName:r.pjName, status:r.status, meta:meta, actual:zeros(), dtar:zeros(), mj:[], mn:[], by:{}, sort:r.divName+'\u0001'+(unit==='pj'?r.pjName:'')+'\u0001'+bkey}; order.push(gkey); }
    var m=map[gkey];
    for(var i=0;i<NM;i++){ m.actual[i]+=Number(r.actual[i])||0; m.dtar[i]+=r.dtar[i]; }
    if(r.jisshi){ m.mj.push(r.date.slice(5)+' '+r.jisshi); }
    if(r.na){ m.mn.push(r.date.slice(5)+' '+r.na); }
    if(r.by){ m.by[r.by]=1; }
  });
  var rows = order.map(function(k){ return map[k]; });
  rows.sort(function(a,b){ return a.sort<b.sort?-1:(a.sort>b.sort?1:0); });
  var head=[];
  if(unit==='pj'){ head.push('事業部','PJ','事業タイプ','状態'); } else { head.push('事業部','事業タイプ'); }
  if(agg==='daily'){ head.push('日付'); } else if(agg==='weekly'){ head.push('週開始','週終了'); } else { head.push('月'); }
  if(agg==='daily'){
    for(var hi=0;hi<NM;hi++){ head.push(ALLM[hi].short); }
    if(unit==='pj'){ head.push('入力者','実施事項','ネクストアクション'); }
  } else {
    for(var hj=0;hj<NM;hj++){ head.push(ALLM[hj].short+'実績', ALLM[hj].short+'目標'); }
    head.push('総達成率%');
  }
  var lines=[ head.map(csvCell).join(',') ];
  rows.forEach(function(m){
    var bt=m.bizType||'ad';
    var mset=bizMetrics(bt), tset=bizTargets(bt);
    function inM(i){ return mset.indexOf(i)>=0; }
    function inT(i){ return tset.indexOf(i)>=0; }
    var c=[];
    if(unit==='pj'){ c.push(m.divName, m.pjName, (BIZ[bt]||BIZ.ad).label, m.status); } else { c.push(m.divName, (BIZ[bt]||BIZ.ad).label); }
    if(agg==='daily'){ c.push(m.meta.date); } else if(agg==='weekly'){ c.push(m.meta.start, m.meta.end); } else { c.push(m.meta.ym); }
    if(agg==='daily'){
      for(var i=0;i<NM;i++){ c.push(inM(i)? m.actual[i] : ''); }
      if(unit==='pj'){ c.push(Object.keys(m.by).join('・'), m.mj.join(' / '), m.mn.join(' / ')); }
    } else {
      var ta=0,tt=0;
      for(var j=0;j<NM;j++){
        var aV = inM(j)? m.actual[j] : '';
        var tV = inT(j)? Math.round(m.dtar[j]) : '';
        c.push(aV, tV);
        if(inT(j)){ ta+=m.actual[j]; tt+=Math.round(m.dtar[j]); }
      }
      c.push(tt>0?Math.round(ta/tt*100):0);
    }
    lines.push(c.map(csvCell).join(','));
  });
  return { csv: lines.join('\r\n'), plabel: plabel, n: rows.length };
}

function downloadCsv(){
  var c=csvCfg();
  var r=buildCsv(c.unit, c.period, c.agg);
  if(r.n===0){ alert('該当する期間・対象のデータがありません。'); return; }
  var unitL = c.unit==='pj'?'PJ別':'事業部別';
  var aggL = c.agg==='daily'?'日次':(c.agg==='weekly'?'週次':'月次');
  var pL = r.plabel.replace(/[\\\/:*?"<>|]/g,'');
  var fname = 'IS日報_'+unitL+'_'+aggL+'_'+pL+'_'+todayISO()+'.csv';
  var blob = new Blob(['\ufeff'+r.csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href=url; a.download=fname; document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
}

  var dy = p.days.find(function(d){return d.id===did;});

function updateDayPct(pid, did){
  var p = findPJ(pid);
  if(!p) return;
  var dy = p.days.find(function(d){return d.id===did;});
  if(!dy) return;
  var div = divOfPJ(pid);
  var ym = state.ui.month;
  var tg = padArr(pjTarget(p, ym));
  var act = padArr(dy.actual);
  var dps = [];
  targetsOf(div).forEach(function(i){
    var d1 = dailyTarget(tg[i], ym);
    var av = Number(act[i])||0;
    var dp = d1>0 ? Math.round(av/d1*100) : null;
    if(dp!==null){ dps.push(dp); }
    var el = $('dp-'+did+'-'+i);
    if(el){
      el.textContent = (dp===null ? '—' : dp+'%');
      el.style.color = (dp===null ? 'var(--faint)' : (dp>=100?'var(--good)':(dp>=70?'var(--warn)':'var(--bad)')));
    }
  });
  var ov = dps.length ? Math.round(dps.reduce(function(a,b){return a+b;},0)/dps.length) : null;
  var oel = $('ov-'+did);
  if(oel){
    oel.textContent = (ov===null ? '—' : ov+'%') + (ov!==null && ov>=100 ? ' ✓' : '');
    oel.style.color = (ov===null ? 'var(--faint)' : (ov>=100?'var(--good)':(ov>=70?'var(--warn)':'var(--bad)')));
  }
}

function cumToDate(pj, mi, dateStr){
  var ym = ymOf(dateStr); var sum=0;
  pj.days.forEach(function(d){ if(ymOf(d.date)===ym && d.date<=dateStr){ sum += Number(padArr(d.actual)[mi])||0; } });

}
function fmtDateSlash(dateStr){ var p=dateStr.split('-'); return p[0]+'/'+p[1]+'/'+p[2]; }
function buildCopyText(div, pj, dy){
  var ym = ymOf(dy.date);
  var t = padArr(pjTarget(pj, ym));
  var act = padArr(dy.actual);
  function dT(i){ return Math.round(dailyTarget(t[i], ym)); }
  function block(i){
    return '■'+ALLM[i].label+'\n本日：'+(Number(act[i])||0)+'（目標：'+dT(i)+'）\n累計：'+cumToDate(pj,i,dy.date)+'（目標：'+t[i]+'）';
  }
  var biz = div.bizType||'ad';
  var lines = [ fmtDateSlash(dy.date), pj.name ];
  if(biz==='school'){
    lines.push(block(2));
    lines.push(block(3));
    lines.push('■面談参加予定者数\n説明会：'+(Number(act[4])||0));
    lines.push('■前日応募者数\n'+(Number(act[5])||0)+'人');
    lines.push('');
    lines.push('■実施\n'+(dy.jisshi||''));
    lines.push('');
    lines.push('■NA\n'+(dy.na||''));
  } else {
    lines.push(block(0));
    lines.push(block(1));
    lines.push(block(2));
    lines.push(block(3));
    lines.push('前日応募数：'+(Number(act[5])||0)+'（目標：'+dT(5)+'）');
    lines.push('');
    lines.push('〇実施事項\n'+(dy.jisshi||''));
    lines.push('');
    lines.push('〇NA（ネクストアクション）\n'+(dy.na||''));
  }
  return lines.join('\n');
}
function copyDay(pid, did){
  var p = findPJ(pid); if(!p) return;
  var div = divOfPJ(pid);
  var dy = p.days.find(function(d){return d.id===did;});
  if(!dy) return;
  copyText(buildCopyText(div, p, dy));
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ showToast('コピーしました'); }, function(){ fallbackCopy(text); });
  } else { fallbackCopy(text); }
}
function fallbackCopy(text){
  var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); showToast('コピーしました'); }catch(e){ showToast('コピーできませんでした'); }
  document.body.removeChild(ta);
}
var _toastT=null;
function showToast(msg){
  var el=$('toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
  el.textContent=msg; el.classList.add('on');
  clearTimeout(_toastT); _toastT=setTimeout(function(){ el.classList.remove('on'); }, 1600);
}

// ===== ログイン・初期化 =====
function signIn(){
  var p = new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({ hd: ALLOWED_DOMAIN });
  auth.signInWithPopup(p).catch(function(e){ $('gateerr').textContent = 'ログインに失敗しました: '+e.message; });
}
auth.onAuthStateChanged(function(user){
  if(user && user.email && user.email.toLowerCase().endsWith('@'+ALLOWED_DOMAIN)){
    $('gate').style.display = 'none';
    $('app').style.display = '';
    $('useremail').textContent = user.email;
    subscribe();
  } else if(user){
    $('gateerr').textContent = '@'+ALLOWED_DOMAIN+' のアカウントでログインしてください。';
    auth.signOut();
  } else {
    $('gate').style.display = '';
    $('app').style.display = 'none';
  }
});
$('signin').addEventListener('click', signIn);
$('signout').addEventListener('click', function(){ auth.signOut(); });
$('tab-dash').addEventListener('click', function(){ setView('dashboard'); });
$('tab-input').addEventListener('click', function(){ setView('input'); });
$('tab-review').addEventListener('click', function(){ setView('review'); });
$('resetwrap').innerHTML = '<button class="btn ghost sm" onclick="resetAll()">全データを消す（共有・要注意）</button>';
</script>
