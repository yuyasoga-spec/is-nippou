<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IS日報目標数値管理ツール ‐LIVプロジェクト推進室‐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f4eee1; --paper:#fffdf7; --ink:#2a2620; --muted:#8a8174; --faint:#b3aa99;
  --line:#e7ddc9; --line2:#d8ccb2;
  --accent:#c0843c; --accent-deep:#9a5e1f;
  --good:#3f7d5a; --good-bg:#e7f0ea; --warn:#b8772e; --warn-bg:#f6ecda; --bad:#b85c4a; --bad-bg:#f6e6e1;
  --m0:#c0843c; --m1:#9a5e1f; --m2:#3f7d5a; --m3:#b85c4a;
}
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--ink); font-family:'Zen Kaku Gothic New',sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased}
.wrap{max-width:1080px; margin:0 auto; padding:28px 22px 80px}
h1{font-family:'Shippori Mincho B1',serif; font-weight:700; font-size:25px; letter-spacing:.04em}
.kicker{font-size:11px; letter-spacing:.14em; color:var(--accent-deep); margin-bottom:4px}
.topline{border-top:2px solid var(--ink); margin:14px 0 18px}
.tabs{display:flex; gap:8px; margin-bottom:18px}
.tab{font-family:'Shippori Mincho B1',serif; font-size:15px; padding:8px 18px; border:1px solid var(--line2); border-radius:999px; background:transparent; color:var(--muted); cursor:pointer}
.tab.on{background:var(--ink); color:#fdf8ee; border-color:var(--ink)}
.bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
.monthnav{display:inline-flex; align-items:center; gap:14px; border:1px solid var(--line2); border-radius:10px; padding:7px 14px; background:var(--paper)}
.monthnav b{font-family:'Shippori Mincho B1',serif; font-size:15px; min-width:96px; text-align:center}
.navbtn{cursor:pointer; color:var(--muted); font-size:18px; line-height:1; user-select:none; padding:0 2px}
.navbtn:hover{color:var(--accent-deep)}
.search{position:relative; flex:1; min-width:200px}
.search input{width:100%; padding:9px 12px 9px 32px; border:1px solid var(--line2); border-radius:10px; background:var(--paper); font-family:inherit; font-size:14px; color:var(--ink)}
.search::before{content:'⌕'; position:absolute; left:11px; top:50%; transform:translateY(-52%); color:var(--faint); font-size:17px}
.chips{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:20px}
.chip{font-size:12.5px; padding:5px 13px; border-radius:999px; border:1px solid var(--line2); background:var(--paper); color:var(--muted); cursor:pointer; white-space:nowrap}
.chip:hover{border-color:var(--accent); color:var(--accent-deep)}
.chip.on{background:var(--accent); border-color:var(--accent); color:#fff}
.chip.toggle.on{background:var(--good); border-color:var(--good)}
.card{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:16px}
.card.dim{opacity:.55}
.divhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px}
.divhead .nm{font-family:'Shippori Mincho B1',serif; font-size:18px; font-weight:600}
.sub{font-size:12px; color:var(--faint)}
.mgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px}
.mcell{background:var(--bg); border-radius:10px; padding:11px 13px}
.mcell .lab{font-size:12px; color:var(--muted)}
.mcell .val{display:flex; align-items:baseline; gap:5px; margin:3px 0 8px}
.mcell .val .a{font-family:'Shippori Mincho B1',serif; font-size:21px; font-weight:600}
.mcell .val .t{font-size:12px; color:var(--faint)}
.mcell .val .p{margin-left:auto; font-size:12.5px; color:var(--muted)}
.bar2{height:6px; border-radius:999px; background:var(--line); overflow:hidden}
.bar2 i{display:block; height:100%; border-radius:999px; background:var(--accent)}
.pjhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:6px 0 4px}
.pjhead .nm{font-size:15px; font-weight:700}
.badge{font-size:11px; padding:2px 9px; border-radius:7px}
.badge.run{background:var(--good-bg); color:var(--good)}
.badge.stop{background:#efe9dd; color:var(--muted)}
.tag{font-size:11.5px; color:var(--faint)}
table.t{width:100%; border-collapse:collapse; table-layout:fixed; margin-top:6px}
table.t th{font-size:11px; color:var(--faint); font-weight:400; text-align:left; padding:5px 7px}
table.t td{padding:8px 7px; border-top:1px solid var(--line); font-size:12.5px; vertical-align:middle}
.num{font-variant-numeric:tabular-nums}
.pace{font-size:11px; padding:2px 9px; border-radius:7px; white-space:nowrap}
.pace.good{background:var(--good-bg); color:var(--good)}
.pace.warn{background:var(--warn-bg); color:var(--warn)}
.pace.bad{background:var(--bad-bg); color:var(--bad)}
.pace.na{color:var(--faint)}
.progwrap{display:flex; align-items:center; gap:9px}
.progwrap .pct{font-size:11.5px; color:var(--muted); min-width:34px; text-align:right}
.empty{color:var(--faint); font-size:13px; padding:18px 4px; text-align:center}
.btn{font-family:inherit; font-size:13px; padding:7px 14px; border:1px solid var(--line2); border-radius:9px; background:var(--paper); color:var(--ink); cursor:pointer}
.btn:hover{border-color:var(--accent); color:var(--accent-deep)}
.btn.dark{background:var(--ink); color:#fdf8ee; border-color:var(--ink)}
.btn.sm{font-size:12px; padding:5px 10px}
.btn.ghost{border-color:transparent; color:var(--faint)}
.btn.ghost:hover{color:var(--bad); border-color:transparent}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
input.inp,select.inp,textarea.inp{font-family:inherit; font-size:13px; color:var(--ink); background:var(--paper); border:1px solid var(--line2); border-radius:8px; padding:6px 8px}
input.num-in{width:62px; text-align:right}
.tgt{display:flex; flex-direction:column; gap:3px}
.tgt label{font-size:11px; color:var(--muted)}
.tgtgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin:6px 0 4px}
.daytable{width:100%; border-collapse:collapse; margin-top:8px}
.daytable th{font-size:11px; color:var(--faint); font-weight:400; padding:5px 6px; text-align:center; border-bottom:1px solid var(--line)}
.daytable td{padding:5px 6px; border-bottom:1px solid var(--line); text-align:center}
.note{margin-top:6px; display:grid; gap:8px}
.note textarea{width:100%; min-height:60px; resize:vertical}
.note .lab{font-size:11px; color:var(--muted); margin-bottom:2px}
.divbox{border:1px solid var(--line); border-radius:14px; margin-bottom:14px; background:var(--paper); overflow:hidden}
.divbar{display:flex; align-items:center; gap:10px; padding:14px 18px; cursor:pointer; flex-wrap:wrap}
.divbar .nm{font-family:'Shippori Mincho B1',serif; font-size:17px; font-weight:600}
.caret{color:var(--muted); transition:transform .15s; font-size:13px}
.caret.open{transform:rotate(90deg)}
.divbody{padding:0 18px 16px}
.pjbox{border:1px solid var(--line); border-radius:11px; margin:10px 0; padding:12px 14px; background:var(--bg)}
.foot{margin-top:24px; font-size:12px; color:var(--faint); text-align:center; line-height:1.9}
.foot a{color:var(--accent-deep)}
#gate{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:50; padding:24px}
.gatecard{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:36px 40px; max-width:420px; text-align:center}
.gatecard h1{margin:6px 0 14px}
.gatecard p{color:var(--muted); font-size:14px; margin-bottom:20px}
.userbar{display:flex; align-items:center; gap:10px; justify-content:flex-end; font-size:12.5px; color:var(--muted); margin-bottom:6px}
.rev{margin-bottom:16px}
.revsec{margin-top:10px}
.revsec .h{font-size:12px; color:var(--accent-deep); font-weight:700; margin-bottom:3px}
.revsec ul{margin:0; padding-left:18px}
.revsec li{font-size:13px; margin:2px 0}
.revsum{display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin:4px 0 8px}
.revsum b{color:var(--ink); font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="gate">
  <div class="gatecard">
    <div class="kicker">LIVプロジェクト推進室</div>
    <h1>IS日報目標数値管理ツール</h1>
    <p>社内アカウント（@liv-inc.jp）でログインしてください。</p>
    <button class="btn dark" id="signin">Googleでログイン</button>
    <div id="gateerr" style="color:var(--bad);margin-top:12px;font-size:13px"></div>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <div class="userbar"><span id="useremail"></span><button class="btn ghost sm" id="signout">ログアウト</button></div>
  <div class="kicker">LIVプロジェクト推進室</div>
  <h1>IS日報目標数値管理ツール</h1>
  <div class="topline"></div>

  <div class="tabs">
    <button class="tab" id="tab-dash">目標ダッシュボード</button>
    <button class="tab" id="tab-input">日次入力</button>
    <button class="tab" id="tab-review">週次総評</button>
  </div>

  <div id="toolbar"></div>
  <div id="root"></div>

  <div class="foot">
    データはチームで共有されています（Firestore）。<br>
    <span id="resetwrap"></span>
  </div>
</div>

<script>
// ====== 設定：ここを自分の値に置き換えてください ======
var firebaseConfig = {
  apiKey: "AIzaSyAK0MFFwWdb8gHYPmBjH4Moq0Zygww_pXo",
  authDomain: "is-nippou-tool.firebaseapp.com",
  projectId: "is-nippou-tool",
  storageBucket: "is-nippou-tool.firebasestorage.app",
  messagingSenderId: "1050189955298",
  appId: "1:1050189955298:web:db3f5bc983d0aa1bcfdebb"
};
var WORKER_URL = "https://isnippou.yuya-soga.workers.dev";
var ALLOWED_DOMAIN = "liv-inc.jp";
// =====================================================
firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();
var docRef = db.collection('encareer').doc('state');

// ===== 定数 =====
var METRICS = ['ADアポ数','AD参加数','面談アポ数','面談参加数'];
var SHORT = ['ADアポ','AD参加','面談アポ','面談参加'];
var MCOL = ['var(--m0)','var(--m1)','var(--m2)','var(--m3)'];
var COLORS = ['#c0843c','#3f7d5a','#4f7cb3','#9a5e1f','#b85c4a','#7a6aa8','#3f8f8f','#a85c8a','#6f8f3a','#c2604a'];
function pickColor(n){ return COLORS[((n%COLORS.length)+COLORS.length)%COLORS.length]; }
function swatch(color, size){ var s=size||11; return '<span style="display:inline-block;width:'+s+'px;height:'+s+'px;border-radius:3px;background:'+color+';flex:none"></span>'; }
var STORE_KEY = 'encareer_target_tool_v1';

// ===== ユーティリティ =====
function $(id){ return document.getElementById(id); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pad2(n){ return String(n).padStart(2,'0'); }
function parseD(s){ return s ? new Date(s+'T00:00:00') : null; }
function todayISO(){
  var d = new Date();
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function curYM(){
  var d = new Date();
  return d.getFullYear()+'-'+pad2(d.getMonth()+1);
}
function ymOf(dateStr){ return (dateStr||'').slice(0,7); }
function daysInMonth(ym){
  var p = ym.split('-');
  return new Date(Number(p[0]), Number(p[1]), 0).getDate();
}
function monthLabel(ym){
  var p = ym.split('-');
  return Number(p[0])+'年'+Number(p[1])+'月';
}
function shiftYM(ym, delta){
  var p = ym.split('-');
  var d = new Date(Number(p[0]), Number(p[1])-1+delta, 1);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1);
}
function fmtMD(s){
  var d = parseD(s);
  if(!d) return '—';
  var wd = ['日','月','火','水','木','金','土'][d.getDay()];
  return (d.getMonth()+1)+'/'+d.getDate()+'('+wd+')';
}
function weekRangeNow(){
  var d = new Date();
  var day = d.getDay();
  var diff = (day===0 ? -6 : 1-day);
  var mon = new Date(d);
  mon.setDate(d.getDate()+diff);
  mon.setHours(0,0,0,0);
  var sun = new Date(mon);
  sun.setDate(mon.getDate()+6);
  sun.setHours(23,59,59,999);
  return [mon, sun];
}
function elapsedDays(ym){
  var p = ym.split('-');
  var y = Number(p[0]), m = Number(p[1]);
  var di = daysInMonth(ym);
  var t = new Date();
  var ty = t.getFullYear(), tm = t.getMonth()+1, td = t.getDate();
  if(y < ty || (y===ty && m < tm)) return di;
  if(y > ty || (y===ty && m > tm)) return 0;
  return Math.min(td, di);
}

// ===== 集計 =====
function pjTarget(pj, ym){
  var t = pj.monthlyTargets[ym];
  return t ? t.slice() : [0,0,0,0];
}
function pjMonthActual(pj, ym){
  var sum = [0,0,0,0];
  pj.days.forEach(function(d){
    if(ymOf(d.date) === ym){
      for(var i=0;i<4;i++){ sum[i] += Number(d.actual[i])||0; }
    }
  });
  return sum;
}
function pjWeekActual(pj){
  var wr = weekRangeNow();
  var sum = [0,0,0,0];
  pj.days.forEach(function(d){
    var dt = parseD(d.date);
    if(dt && dt >= wr[0] && dt <= wr[1]){
      for(var i=0;i<4;i++){ sum[i] += Number(d.actual[i])||0; }
    }
  });
  return sum;
}
function weekTarget(monthTargetI, ym){
  return monthTargetI * 7 / daysInMonth(ym);
}
function dailyTarget(monthTargetI, ym){
  return monthTargetI / daysInMonth(ym);
}
function fmt1(x){ return Math.round(x*10)/10; }
function paceOf(actualI, targetI, ym){
  if(targetI <= 0) return {label:'—', cls:'na'};
  var di = daysInMonth(ym);
  var el = elapsedDays(ym);
  var expected = targetI * (el/di);
  if(expected <= 0) return {label:'開始前', cls:'na'};
  var r = actualI/expected;
  if(r >= 1) return {label:'順調', cls:'good'};
  if(r >= 0.85) return {label:'やや遅れ', cls:'warn'};
  return {label:'遅れ', cls:'bad'};
}
function activeProjects(div){
  return div.projects.filter(function(p){ return p.status === '運用中'; });
}
function divRollup(div, ym){
  var mt=[0,0,0,0], ma=[0,0,0,0], wa=[0,0,0,0];
  activeProjects(div).forEach(function(p){
    var t = pjTarget(p, ym);
    var a = pjMonthActual(p, ym);
    var w = pjWeekActual(p);
    for(var i=0;i<4;i++){ mt[i]+=t[i]; ma[i]+=a[i]; wa[i]+=w[i]; }
  });
  return {target:mt, actual:ma, week:wa};
}
function pct(a, t){ return t>0 ? Math.round(a/t*100) : 0; }
function barColor(p){ return p>=85 ? 'var(--good)' : (p>=60 ? 'var(--accent)' : 'var(--warn)'); }

// ===== 状態 =====
var state = { divisions: [], reviews: {}, ui: { view:'dashboard', month: curYM(), search:'', filterId:null, activeOnly:false } };

function seed(){
  var ym = curYM();
  function day(date, a){ return {id:uid(), date:date, actual:a, jisshi:'', na:'', noteOpen:false}; }
  var p = ym.split('-'); var yy=p[0], mm=p[1];
  function d(n){ return yy+'-'+mm+'-'+pad2(n); }
  return {
    divisions: [{
      id: uid(), name: 'IS事業部', color: '#4f7cb3', open: true,
      projects: [
        { id: uid(), name: 'Star Creation Next', color: '#c0843c', status: '運用中', open: true,
          monthlyTargets: makeT(ym, [80,64,48,32]),
          days: [ day(d(1),[3,2,2,1]), day(d(2),[3,3,1,1]), day(d(3),[2,2,2,2]),
                  day(d(4),[3,2,1,1]), day(d(5),[2,2,2,1]), day(d(8),[3,2,1,1]),
                  day(d(9),[2,2,1,1]), day(d(10),[3,2,2,1]), day(d(11),[2,1,1,1]) ] },
        { id: uid(), name: 'TGCキャリア', color: '#3f7d5a', status: '運用中', open: true,
          monthlyTargets: makeT(ym, [60,48,36,24]),
          days: [ day(d(2),[3,2,1,1]), day(d(3),[2,2,2,1]), day(d(4),[3,3,2,2]),
                  day(d(5),[2,2,1,1]), day(d(9),[3,2,2,1]), day(d(10),[2,2,1,1]),
                  day(d(11),[3,2,1,1]) ] },
        { id: uid(), name: '旧媒体PJ', color: '#9a8f7d', status: '停止中', open: false,
          monthlyTargets: makeT(ym, [20,12,8,4]), days: [] }
      ]
    }],
    ui: { view:'dashboard', month: ym, search:'', filterId:null, activeOnly:false }
  };
}
function makeT(ym, arr){ var o={}; o[ym]=arr.slice(); return o; }

function migrateColors(){
  state.divisions.forEach(function(d, di){
    if(!d.color){ d.color = pickColor(di); }
    d.projects.forEach(function(p, pi){ if(!p.color){ p.color = pickColor(di*3+pi+1); } });
  });
}
var _lastSync = '';
function applySnap(snap){
  if(!snap.exists){ initEmpty(); return; }
  var data = snap.data() || {};
  var divisions = data.divisions || [];
  var reviews = data.reviews || {};
  var js = JSON.stringify({d:divisions, r:reviews});
  if(js === _lastSync) return;
  _lastSync = js;
  state.divisions = divisions;
  state.reviews = reviews;
  migrateColors();
  render();
}
function initEmpty(){
  state.divisions = [];
  state.reviews = {};
  _lastSync = JSON.stringify({d:[], r:{}});
  docRef.set({ divisions: [], reviews: {} }).catch(function(e){ console.error(e); });
  render();
}
var _subbed = false;
function subscribe(){
  if(_subbed) return;
  _subbed = true;
  docRef.onSnapshot(function(snap){ applySnap(snap); }, function(err){ console.error('snapshot', err); });
}
var _saveT = null;
function save(){
  if(!docRef) return;
  clearTimeout(_saveT);
  _saveT = setTimeout(function(){
    var payload = { divisions: state.divisions, reviews: state.reviews };
    _lastSync = JSON.stringify({d:payload.divisions, r:payload.reviews});
    docRef.set(payload).catch(function(e){ console.error('save', e); });
  }, 400);
}

// ===== 検索ヘルパ =====
function findDiv(id){ return state.divisions.find(function(d){ return d.id===id; }); }
function findPJ(id){
  for(var i=0;i<state.divisions.length;i++){
    var p = state.divisions[i].projects.find(function(x){ return x.id===id; });
    if(p) return p;
  }
  return null;
}
function divOfPJ(pid){
  for(var i=0;i<state.divisions.length;i++){
    if(state.divisions[i].projects.some(function(x){ return x.id===pid; })) return state.divisions[i];
  }
  return null;
}

// ===== ダッシュボード描画 =====
function matchSearch(div){
  var s = (state.ui.search||'').trim().toLowerCase();
  if(!s) return {div:true, pjs:null};
  var dn = div.name.toLowerCase().indexOf(s) >= 0;
  var pjs = div.projects.filter(function(p){ return p.name.toLowerCase().indexOf(s) >= 0; });
  if(dn) return {div:true, pjs:null};
  if(pjs.length) return {div:true, pjs:pjs.map(function(p){return p.id;})};
  return {div:false, pjs:[]};
}
function visibleProjects(div){
  var out = div.projects.slice();
  if(state.ui.activeOnly){ out = out.filter(function(p){ return p.status==='運用中'; }); }
  var fid = state.ui.filterId;
  if(fid){
    if(findDiv(fid)){ if(div.id!==fid) return []; }
    else if(findPJ(fid)){ out = out.filter(function(p){ return p.id===fid; }); }
  }
  var ms = matchSearch(div);
  if(!ms.div) return [];
  if(ms.pjs){ out = out.filter(function(p){ return ms.pjs.indexOf(p.id)>=0; }); }
  return out;
}

function renderDashboard(){
  var ym = state.ui.month;
  var html = '';
  var shown = 0;
  state.divisions.forEach(function(div){
    var fid = state.ui.filterId;
    if(fid && findDiv(fid) && div.id!==fid){
      if(!(findPJ(fid) && divOfPJ(fid) && divOfPJ(fid).id===div.id)) return;
    }

      html += '<table class="t"><colgroup><col style="width:19%"><col style="width:11%"><col style="width:11%"><col style="width:10%"><col style="width:26%"><col style="width:12%"><col style="width:11%"></colgroup>';
      html += '<tr><th>指標</th><th style="text-align:right">月目標</th><th style="text-align:right">1日目標</th><th style="text-align:right">月実績</th><th>月進捗</th><th style="text-align:right">今週 実/目</th><th>ペース</th></tr>';
      for(var i=0;i<4;i++){
        var p = pct(a[i], t[i]);
        var wt = Math.round(weekTarget(t[i], ym));
        var pc = paceOf(a[i], t[i], ym);
        html += '<tr>'+
          '<td style="color:var(--muted)">'+SHORT[i]+'</td>'+
          '<td style="text-align:right" class="num">'+t[i]+'</td>'+
          '<td style="text-align:right;color:var(--muted)" class="num">'+fmt1(dailyTarget(t[i], ym))+'</td>'+
          '<td style="text-align:right" class="num">'+a[i]+'</td>'+
          '<td><div class="progwrap"><div class="bar2" style="flex:1"><i style="width:'+Math.min(p,100)+'%;background:'+barColor(p)+'"></i></div>'+
          '<span class="pct num">'+p+'%</span></div></td>'+
          '<td style="text-align:right;color:var(--muted)" class="num">'+w[i]+' / '+wt+'</td>'+
          '<td><span class="pace '+pc.cls+'">'+pc.label+'</span></td>'+

  });
  if(shown===0){ html = '<div class="empty">該当する事業部・PJがありません。検索やタグを変えてみてください。</div>'; }
  $('root').innerHTML = html;
}

    h += '<div class="tgt"><label>'+SHORT[i]+'</label>'+

  }

  for(var j=0;j<4;j++){ dline.push(SHORT[j]+' '+fmt1(dailyTarget(t[j], ym))); }
  h += '<div class="sub" style="margin:0 0 4px">1日あたり目標（自動）：'+dline.join(' ／ ')+'</div>';
  // 日次入力
  var dt = [];
  for(var k=0;k<4;k++){ dt.push(dailyTarget(t[k], ym)); }
  h += '<table class="daytable"><tr><th style="text-align:left">日付</th>';
  for(var i=0;i<4;i++){ h += '<th>'+SHORT[i]+'</th>'; }
  h += '<th>達成率</th><th></th><th></th></tr>';
  pj.days.slice().sort(function(a,b){ return (a.date<b.date?1:-1); }).forEach(function(dy){
    h += '<tr><td style="text-align:left"><input class="inp" type="date" value="'+dy.date+'" onchange="setDate(\''+pj.id+'\',\''+dy.id+'\',this.value)"></td>';
    var dps = [];
    for(var i=0;i<4;i++){
      var av = Number(dy.actual[i])||0;
      var dp = dt[i]>0 ? Math.round(av/dt[i]*100) : null;
      if(dp!==null){ dps.push(dp); }
      var dpc = dp===null ? 'var(--faint)' : (dp>=100?'var(--good)':(dp>=70?'var(--warn)':'var(--bad)'));
      h += '<td><input class="inp num-in" type="number" min="0" value="'+dy.actual[i]+'" oninput="setActual(\''+pj.id+'\',\''+dy.id+'\','+i+',this.value)">'+
        '<div class="num" id="dp-'+dy.id+'-'+i+'" style="font-size:10px;margin-top:2px;color:'+dpc+'">'+(dp===null?'—':dp+'%')+'</div></td>';
    }
    var ov = dps.length ? Math.round(dps.reduce(function(a,b){return a+b;},0)/dps.length) : null;
    var ovc = ov===null ? 'var(--faint)' : (ov>=100?'var(--good)':(ov>=70?'var(--warn)':'var(--bad)'));
    var chk = (ov!==null && ov>=100) ? ' ✓' : '';
    h += '<td><span class="num" id="ov-'+dy.id+'" style="font-weight:700;color:'+ovc+'">'+(ov===null?'—':ov+'%')+chk+'</span></td>';

    h += '<td><button class="btn ghost sm" onclick="removeDay(\''+pj.id+'\',\''+dy.id+'\')">×</button></td></tr>';
    if(dy.noteOpen){

        '</div></td></tr>';
    }
  });
  h += '</table>';
  h += '<button class="btn sm" style="margin-top:8px" onclick="addDay(\''+pj.id+'\')">＋ 日次を追加</button>';
  h += '</div>';
  return h;
}

// ===== 週次総評 =====
function isoOf(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function recentWeeks(n){
  var mon = weekRangeNow()[0];
  var out = [];
  for(var i=0;i<n;i++){
    var m = new Date(mon); m.setDate(mon.getDate()-7*i);
    out.push(isoOf(m));
  }
  return out;
}
function weekLabelOf(mondayIso){
  var mon = parseD(mondayIso); var sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return (mon.getMonth()+1)+'/'+mon.getDate()+'〜'+(sun.getMonth()+1)+'/'+sun.getDate();
}
function weekActualRange(pj, mon, sun){
  var sum=[0,0,0,0];
  pj.days.forEach(function(d){
    var dt=parseD(d.date);
    if(dt && dt>=mon && dt<=sun){ for(var i=0;i<4;i++){ sum[i]+=Number(d.actual[i])||0; } }
  });
  return sum;
}
function weekTextsRange(pj, mon, sun){
  var js=[], na=[];
  pj.days.forEach(function(d){
    var dt=parseD(d.date);
    if(dt && dt>=mon && dt<=sun){
      if(d.jisshi && d.jisshi.trim()){ js.push(d.jisshi.trim()); }
      if(d.na && d.na.trim()){ na.push(d.na.trim()); }
    }
  });
  return { jisshi: js, na: na };
}
function buildWeekContext(weekIso){
  var mon = parseD(weekIso); mon.setHours(0,0,0,0);
  var sun = new Date(mon); sun.setDate(mon.getDate()+6); sun.setHours(23,59,59,999);
  var ymRef = ymOf(weekIso);
  var totT=[0,0,0,0], totA=[0,0,0,0];
  var projects = [];
  state.divisions.forEach(function(div){
    activeProjects(div).forEach(function(pj){
      var a = weekActualRange(pj, mon, sun);
      var mt = pjTarget(pj, ymRef);
      var wt = [];
      for(var i=0;i<4;i++){ wt.push(Math.round(weekTarget(mt[i], ymRef))); totT[i]+=wt[i]; totA[i]+=a[i]; }
      var txt = weekTextsRange(pj, mon, sun);
      if((a[0]+a[1]+a[2]+a[3])>0 || txt.jisshi.length || txt.na.length){
        projects.push({ division: div.name, name: pj.name, weekTarget: wt, weekActual: a, jisshi: txt.jisshi, na: txt.na });
      }
    });
  });
  return { week: weekLabelOf(weekIso), metrics: METRICS, totalTarget: totT, totalActual: totA, projects: projects };
}
var _gen = {};
function callWorker(ctx){
  return auth.currentUser.getIdToken().then(function(token){
    return fetch(WORKER_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
      body: JSON.stringify({ context: ctx })
    });
  }).then(function(res){
    if(!res.ok){ return res.text().then(function(t){ throw new Error(res.status+' '+t); }); }
    return res.json();
  });
}
function generateReview(weekIso){
  _gen[weekIso] = true; renderReview();
  var ctx = buildWeekContext(weekIso);
  callWorker(ctx).then(function(r){
    state.reviews[weekIso] = {
      did: r.did||[], achieved: r.achieved||[], concerns: r.concerns||[],
      by: (auth.currentUser && auth.currentUser.email) || '', at: Date.now()
    };
    _gen[weekIso] = false;
    save(); renderReview();
  }).catch(function(e){
    _gen[weekIso] = false; renderReview();
    alert('総評の生成に失敗しました。\n'+e.message+'\n（Worker URL・APIキー・ログインを確認してください）');
  });
}
function renderReview(){
  var weeks = recentWeeks(8);
  var thisWeek = isoOf(weekRangeNow()[0]);
  var html = '';
  weeks.forEach(function(wk){
    var ctx = buildWeekContext(wk);
    var rev = state.reviews[wk];
    var loading = !!_gen[wk];
    html += '<div class="card rev">';
    html += '<div class="divhead"><span class="nm">'+weekLabelOf(wk)+'</span>';
    if(wk===thisWeek){ html += '<span class="sub">今週</span>'; }
    html += '</div>';
    html += '<div class="revsum">';
    for(var i=0;i<4;i++){
      var p = pct(ctx.totalActual[i], ctx.totalTarget[i]);
      html += '<span>'+SHORT[i]+' <b>'+ctx.totalActual[i]+'</b> / '+ctx.totalTarget[i]+'（'+p+'%）</span>';
    }
    html += '</div>';
    if(rev){
      html += '<div class="revsec"><div class="h">実施したこと</div><ul>'+(rev.did||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
      html += '<div class="revsec"><div class="h">成果・できたこと</div><ul>'+(rev.achieved||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
      html += '<div class="revsec"><div class="h">懸念点</div><ul>'+(rev.concerns||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
      if(rev.by){ html += '<div class="sub" style="margin-top:8px">生成: '+esc(rev.by)+'</div>'; }
    } else {
      html += '<div class="sub" style="margin:6px 0">まだ総評がありません。</div>';
    }
    html += '<div style="margin-top:10px">';
    if(loading){ html += '<button class="btn" disabled>生成中…</button>'; }
    else { html += '<button class="btn dark" onclick="generateReview(\''+wk+'\')">✨ '+(rev?'再生成':'総評を生成')+'</button>'; }
    html += '</div></div>';
  });
  $('root').innerHTML = html;
}

// ===== 操作 =====
function setView(v){ state.ui.view = v; render(); }
function moveMonth(delta){ state.ui.month = shiftYM(state.ui.month, delta); render(); }
function setSearch(v){ state.ui.search = v; renderDashboard(); }
function setFilter(id){ state.ui.filterId = id; render(); }
function toggleActiveOnly(){ state.ui.activeOnly = !state.ui.activeOnly; render(); }

function addDiv(){ state.divisions.push({id:uid(), name:'新規事業部', color:pickColor(state.divisions.length), open:true, projects:[]}); render(); save(); }
function removeDiv(id){ if(confirm('この事業部を削除しますか？')){ state.divisions = state.divisions.filter(function(d){return d.id!==id;}); render(); save(); } }
function renameDiv(id,v){ var d=findDiv(id); if(d){ d.name=v; save(); } }
function setDivColor(id,v){ var d=findDiv(id); if(d){ d.color=v; save(); } }
function toggleDiv(id){ var d=findDiv(id); if(d){ d.open=!d.open; renderInput(); save(); } }

function addPJ(did){
  var d = findDiv(did);
  if(d){ d.projects.push({id:uid(), name:'新規PJ', color:pickColor(d.projects.length+3), status:'運用中', open:true, monthlyTargets:{}, days:[]}); render(); save(); }
}
function removePJ(id){ if(confirm('このPJを削除しますか？')){ var d=divOfPJ(id); if(d){ d.projects=d.projects.filter(function(p){return p.id!==id;}); render(); save(); } } }
function renamePJ(id,v){ var p=findPJ(id); if(p){ p.name=v; save(); } }
function setPjColor(id,v){ var p=findPJ(id); if(p){ p.color=v; save(); } }
function setStatus(id,v){ var p=findPJ(id); if(p){ p.status=v; render(); save(); } }
function setTarget(pid, mi, v){
  var p = findPJ(pid);
  if(!p) return;
  var ym = state.ui.month;
  if(!p.monthlyTargets[ym]){ p.monthlyTargets[ym] = [0,0,0,0]; }
  p.monthlyTargets[ym][mi] = Number(v)||0;
  save();
}

function addDay(pid){
  var p = findPJ(pid);
  if(p){ p.days.push({id:uid(), date:todayISO(), actual:[0,0,0,0], jisshi:'', na:'', noteOpen:false}); renderInput(); save(); }
}
function removeDay(pid, did){
  var p = findPJ(pid);
  if(p){ p.days = p.days.filter(function(d){return d.id!==did;}); renderInput(); save(); }
}
function setActual(pid, did, mi, v){
  var p = findPJ(pid);
  if(!p) return;
  var dy = p.days.find(function(d){return d.id===did;});
  if(dy){ dy.actual[mi] = Number(v)||0; updateDayPct(pid, did); save(); }
}
function updateDayPct(pid, did){
  var p = findPJ(pid);
  if(!p) return;
  var dy = p.days.find(function(d){return d.id===did;});
  if(!dy) return;
  var ym = state.ui.month;
  var tg = pjTarget(p, ym);
  var dps = [];
  for(var i=0;i<4;i++){
    var d1 = dailyTarget(tg[i], ym);
    var av = Number(dy.actual[i])||0;
    var dp = d1>0 ? Math.round(av/d1*100) : null;
    if(dp!==null){ dps.push(dp); }
    var el = $('dp-'+did+'-'+i);
    if(el){
      el.textContent = (dp===null ? '—' : dp+'%');
      el.style.color = (dp===null ? 'var(--faint)' : (dp>=100?'var(--good)':(dp>=70?'var(--warn)':'var(--bad)')));
    }
  }
  var ov = dps.length ? Math.round(dps.reduce(function(a,b){return a+b;},0)/dps.length) : null;
  var oel = $('ov-'+did);
  if(oel){
    oel.textContent = (ov===null ? '—' : ov+'%') + (ov!==null && ov>=100 ? ' ✓' : '');
    oel.style.color = (ov===null ? 'var(--faint)' : (ov>=100?'var(--good)':(ov>=70?'var(--warn)':'var(--bad)')));
  }
}
function setDate(pid, did, v){
  var p = findPJ(pid);
  if(!p) return;
  var dy = p.days.find(function(d){return d.id===did;});
  if(dy){ dy.date = v; save(); }
}
function setText(pid, did, key, v){
  var p = findPJ(pid);
  if(!p) return;
  var dy = p.days.find(function(d){return d.id===did;});
  if(dy){ dy[key] = v; save(); }
}
function toggleNote(pid, did){
  var p = findPJ(pid);
  if(!p) return;
  var dy = p.days.find(function(d){return d.id===did;});
  if(dy){ dy.noteOpen = !dy.noteOpen; renderInput(); save(); }
}

function resetAll(){
  if(confirm('チーム共有の全データ（事業部・PJ・日次・総評）を消します。元に戻せません。よろしいですか？')){
    state.divisions = []; state.reviews = {};
    render(); save();
  }
}

// ===== ログイン・初期化 =====
function signIn(){
  var p = new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({ hd: ALLOWED_DOMAIN });
  auth.signInWithPopup(p).catch(function(e){ $('gateerr').textContent = 'ログインに失敗しました: '+e.message; });
}
auth.onAuthStateChanged(function(user){
  if(user && user.email && user.email.toLowerCase().endsWith('@'+ALLOWED_DOMAIN)){
    $('gate').style.display = 'none';
    $('app').style.display = '';
    $('useremail').textContent = user.email;
    subscribe();
  } else if(user){
    $('gateerr').textContent = '@'+ALLOWED_DOMAIN+' のアカウントでログインしてください。';
    auth.signOut();
  } else {
    $('gate').style.display = '';
    $('app').style.display = 'none';
  }
});
$('signin').addEventListener('click', signIn);
$('signout').addEventListener('click', function(){ auth.signOut(); });
$('tab-dash').addEventListener('click', function(){ setView('dashboard'); });
$('tab-input').addEventListener('click', function(){ setView('input'); });
$('tab-review').addEventListener('click', function(){ setView('review'); });
$('resetwrap').innerHTML = '<button class="btn ghost sm" onclick="resetAll()">全データを消す（共有・要注意）</button>';
</script>
</body>
</html>
